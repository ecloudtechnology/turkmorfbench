[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turkmorfbench"
version = "3.6.2"
description = "TurkMorfBench — Turkish morphology benchmark for language models / Türkçe morfoloji kıyası"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "eCloud Tech.", email = "info@e-cloud.web.tr" }]
maintainers = [{ name = "eCloud Tech.", email = "info@e-cloud.web.tr" }]
keywords = ["turkish", "türkçe", "morphology", "morfoloji", "benchmark",
            "evaluation", "llm", "vowel-harmony", "wug-test"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: Turkish",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/ecloudtechnology/turkmorfbench"
Repository = "https://github.com/ecloudtechnology/turkmorfbench"
Dataset = "https://huggingface.co/datasets/ecloudtech/TurkMorfBench"

[project.scripts]
turkmorfbench = "turkmorfbench.__main__:main"

[tool.setuptools.packages.find]
include = ["turkmorfbench*"]

[tool.setuptools.package-data]
turkmorfbench = ["veri/*.json"]
